name: 發布安裝器
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: installer/go.mod
          cache-dependency-path: installer/go.sum
      - name: 核對版本
        shell: pwsh
        run: |
          $version = (Get-Content manifest.json -Raw | ConvertFrom-Json).installer.version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag 與 manifest 版本不一致' }
      - run: ./scripts/test.ps1
        shell: pwsh
      - name: 安裝建置工具
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0
      - run: ./scripts/build-release.ps1
        shell: pwsh
      - name: 發布執行檔
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$env:GITHUB_REF_NAME" dist/ArcheRageAddonInstaller.exe --verify-tag --title "$env:GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
